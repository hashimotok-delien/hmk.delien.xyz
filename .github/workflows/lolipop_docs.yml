name: lolipop
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**' # docsフォルダ内のファイル変更時のみ実行
      - '.github/workflows/lolipop_docs.yml' # このワークフロー自体の変更時も実行
jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DOCS_DIR }}
          local-dir: ./docs/